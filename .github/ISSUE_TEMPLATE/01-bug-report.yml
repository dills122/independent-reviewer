name: Bug or unexpected behavior
description: Tell us what went wrong; a minimal report is welcome
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Only the two written answers marked required are needed to start. Partial reports are welcome; maintainers can ask focused follow-up questions.

        If the problem involves a Git repository, the optional [capture helper](https://github.com/dills122/independent-reviewer/blob/main/docs/bug-reporting.md#optional-git-capture-helper) gathers useful metadata without including source or diff contents.

        Do not disclose vulnerabilities, credentials, private source, or unredacted review artifacts here. Use the repository's private security-reporting link instead.

  - type: checkboxes
    id: safety
    attributes:
      label: Public-report safety
      options:
        - label: This report does not disclose a security vulnerability or sensitive material.
          required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected instead. Error text and impact are useful, but plain language is fine.
      placeholder: I ran ...; it produced ...; I expected ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: List the smallest sequence you know. If it is intermittent or you cannot reproduce it, say what you were doing when it happened.
      placeholder: |
        1. Start with ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: git-capture
    attributes:
      label: Git capture (optional)
      description: For repository-dependent problems, paste the reviewed output from the command in the reporting guide. A public URL plus base/head commits lets maintainers replay clean public changesets.
      placeholder: Run support/collect-bug-report-info.sh --repo /path/to/target, review its output, and paste it here.

  - type: input
    id: reviewer-version
    attributes:
      label: Independent Reviewer version (optional)
      description: Release version or full commit SHA, if known. The capture helper fills this in.
      placeholder: v1.2.3 or 0123456789abcdef0123456789abcdef01234567

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Add sanitized terminal output, exit codes, stack traces, request/config details, or provider/model route. Remove credentials, private code, author content, local paths, and provider request bodies.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else? (optional)
      description: Frequency, last known-good version, screenshots, a minimal reproduction, related issues, or a workaround can all help.
